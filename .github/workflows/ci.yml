name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./ai-material

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./server

      - name: Lint frontend
        run: pnpm lint:frontend

      - name: Lint backend
        run: pnpm lint:backend

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./ai-material

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./server

      - name: Build frontend
        run: pnpm build:frontend

      - name: Build backend
        run: pnpm build:backend
